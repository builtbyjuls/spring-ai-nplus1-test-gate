name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build and verify with Maven
        run: ./mvnw -B clean verify

      - name: Publish N+1 Gate Summary to Step Summary
        if: always()
        run: |
          for f in $(find . -name "summary.md" -path "*/target/nplus1-reports/*"); do
            echo "Publishing $f to GITHUB_STEP_SUMMARY"
            cat "$f" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          done

      - name: Archive N+1 Gate Diagnostic Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nplus1-diagnostic-reports
          path: '**/target/nplus1-reports/*'
          if-no-files-found: ignore

